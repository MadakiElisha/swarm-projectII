# Publish the web GCS (replay of the recorded showcase mission) to GitHub Pages.
# One-time setup by the repo owner: Settings -> Pages -> Source: "GitHub Actions".
# Then run it from the Actions tab ("Publish GCS demo" -> Run workflow).
name: Publish GCS demo

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # optional repo secret CESIUM_ION_TOKEN -> 3D terrain/buildings on the public page.
      # A browser app's token is visible to visitors: restrict it to this site's URL in ion.
      - name: Cesium ion token
        env:
          TOKEN: ${{ secrets.CESIUM_ION_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then printf "window.SW_ION_TOKEN = '%s';\n" "$TOKEN" > gcs/config.local.js; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: gcs
      - id: deployment
        uses: actions/deploy-pages@v4
